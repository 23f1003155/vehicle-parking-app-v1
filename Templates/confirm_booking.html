{% extends "base.html" %}

{% block title %}Confirm Booking{% endblock %}

{% block content %}
<h2>Confirm Your Parking Booking</h2>

<form method="POST" action="{{ url_for('confirm_booking') }}" class="mx-auto" style="max-width: 600px;">
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-control" value="{{ user.full_name }}" readonly>
  </div>
  <div class="mb-3">
    <label class="form-label">Parking Lot ID</label>
    <input type="text" class="form-control" value="{{ lot.id }}" readonly>
  </div>
  <div class="mb-3">
    <label class="form-label">Parking Lot Location</label>
    <input type="text" class="form-control" value="{{ lot.prime_location_name }}" readonly>
  </div>
  <div class="mb-3">
    <label class="form-label">Spot Number</label>
    <input type="text" class="form-control" value="{{ spot_number }}" readonly>
    <input type="hidden" name="spot_id" value="{{ spot_id }}">
  </div>
  <div class="mb-3">
    <label for="vehicle_number" class="form-label">Vehicle Number</label>
    <input type="text" class="form-control" id="vehicle_number" name="vehicle_number" required>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <button type="submit" class="btn btn-success">Book Now</button>
    <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
